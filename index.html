<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d0c">
<title>Compass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@1&display=swap">
<style>
:root{
  --night:#070d0c; --glow:#3a2a10; --text:#e3cf9c;
  --body:"IM Fell English",Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{
  margin:0; min-height:100dvh; overflow:hidden;
  background:
    radial-gradient(60% 45% at 50% 46%, var(--glow), transparent 70%),
    radial-gradient(120% 90% at 50% 40%, #10201b, var(--night));
  color:var(--text); font-family:var(--body); font-style:italic; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::after{content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.65));}
#compass{width:min(92vw,66dvh,460px); height:auto; transform-origin:50% 50%; will-change:transform; filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
#status{margin:0; position:relative; width:min(88vw,26em); line-height:1.35; min-height:1.4em; font-size:1.15rem; letter-spacing:.06em; opacity:.75; transition:opacity 1.6s ease}
#status.gone{opacity:0}
#status .t{position:absolute; left:0; right:0; top:0; white-space:pre-line}

#sky{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
#compass,#status{position:relative; z-index:1}
@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o)*.4)}}
@media (prefers-reduced-motion: reduce){#sky circle{animation:none!important}}

</style>
</head>

  gradDome.setAttribute("cx", (.5 + ux * .15 * near).toFixed(3)); gradDome.setAttribute("cy", (.5 + uy * .15 * near).toFixed(3));

  gleamEl.setAttribute("transform", `translate(${(200 + ux * gd).toFixed(1)} ${(200 + uy * gd).toFixed(1)})`);

}

function frame(t) {

  if (!ready) {

  const goalX = clamp(rawBeta, -50, 50) / 50 * MAX_TILT;

      return { x: dx * Math.cos(a) - dy * Math.sin(a), y: dx * Math.sin(a) + dy * Math.cos(a), m: p.m }; });
    const x0 = Math.min(...raw.map(p => p.x)), x1 = Math.max(...raw.map(p => p.x));
    const y0 = Math.min(...raw.map(p => p.y)), y1 = Math.max(...raw.map(p => p.y));
    const ox = alignRight ? anchorX - x1 : anchorX - x0, oy = alignBottom ? anchorY - y1 : anchorY - y0;
    const P = raw.map(p => ({ x: p.x + ox, y: p.y + oy, m: p.m }));
    P.forEach(p => {
      el("circle", { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: (2.6 + p.m * 2.2).toFixed(1), fill: "#f3ead0", opacity: (.05 * p.m).toFixed(3) });
      el("circle", { cx: p.x.toFixed(1), cy: p.y.toFixed(1), r: (.9 + p.m * .9).toFixed(2), fill: "#f6eed6", opacity: (.35 + p.m * .35).toFixed(2) });
    });
  }
  function draw() {
    const W = innerWidth, H = innerHeight; sky.setAttribute("viewBox", `0 0 ${W} ${H}`);
    while (sky.firstChild) sky.removeChild(sky.firstChild);
    const r = rng(20261030), tints = ["#f3ead0", "#f3ead0", "#d6e4ff", "#ffe6b8"];
    for (let i = 0; i < 150; i++) {
      const x = r() * W, y = r() * H, b = r(), tw = r() < .22;
      const c = el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (.35 + b * b * 1.0).toFixed(2), fill: tints[(r() * tints.length) | 0] });
      const o = (.12 + b * .38).toFixed(2); c.style.opacity = o;
      if (tw) { c.style.setProperty("--o", o); c.style.animation = `tw ${3 + r() * 4}s ease-in-out ${(-r() * 6).toFixed(1)}s infinite`; }
    }
    // Cassiopeia, upper left
    const kC = Math.max(130, Math.min(W * .42, 270)) / 13.15;
    place(CAS, kC, -12, W * .12, Math.max(46, H * .07 + 10), false, false);
  }
  draw(); addEventListener("resize", draw);
})();
</script>
