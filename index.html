<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d0c">
<title>Compass</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@1&display=swap">
<style>
:root{
  --night:#070d0c; --glow:#3a2a10; --text:#e3cf9c;
  --body:"IM Fell English",Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{
  margin:0; min-height:100dvh; overflow:hidden;
  background:
    radial-gradient(60% 45% at 50% 46%, var(--glow), transparent 70%),
    radial-gradient(120% 90% at 50% 40%, #10201b, var(--night));
  color:var(--text); font-family:var(--body); font-style:italic; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent;
}
body::after{content:""; position:fixed; inset:0; pointer-events:none;
  background:radial-gradient(90% 70% at 50% 45%, transparent 55%, rgba(0,0,0,.65));}
#compass{width:min(92vw,66dvh,460px); height:auto; transform-origin:50% 50%; will-change:transform; filter:drop-shadow(0 20px 30px rgba(0,0,0,.7))}
#status{margin:0; max-width:min(88vw,26em); line-height:1.35; min-height:1.4em; font-size:1.15rem; letter-spacing:.06em; opacity:.75; transition:opacity 1.6s ease}
#status.gone{opacity:0}
#sky{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
#compass,#status{position:relative; z-index:1}
@keyframes tw{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o)*.4)}}
@media (prefers-reduced-motion: reduce){#sky circle{animation:none!important}}

</style>
</head>

<script>
// Target: Kaʻaʻawa, Oʻahu, Hawaiʻi. Swap in real coordinates later.
const TARGET = { lat: 21.5560, lon: -157.8510 };
const MIN_HUNT_MS = 3600;      // the dial always searches at least this long
const NO_SENSOR_MS = 2500;     // extra wait for a heading before assuming no compass sensor
const AMP = matchMedia("(prefers-reduced-motion: reduce)").matches ? 0.35 : 1;

const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
const wrap = a => ((a + 540) % 360) - 180;
function bearingTo(a, b) {
  const p1 = rad(a.lat), p2 = rad(b.lat), dl = rad(b.lon - a.lon);
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);

// Sensors
const dial = document.getElementById("dial"), statusEl = document.getElementById("status");
let pos = null, rawHeading = null, heading = null;
let rawBeta = 0, rawGamma = 0;   // phone tilt: beta = front/back, gamma = left/right
let needsTap = false;        // iOS: motion access must be granted by a tap
let noSensorNote = false;    // set when we fall back to a north-up dial
function say(t) { statusEl.textContent = t; statusEl.classList.remove("gone"); }

function onOrient(e) {

    needsTap = true;

const compassEl = document.getElementById("compass"), glareEl = document.getElementById("glare");

      const c = el("circle", { cx: x.toFixed(1), cy: y.toFixed(1), r: (.35 + b * b * 1.0).toFixed(2), fill: tints[(r() * tints.length) | 0] });
      const o = (.12 + b * .38).toFixed(2); c.style.opacity = o;
      if (tw) { c.style.setProperty("--o", o); c.style.animation = `tw ${3 + r() * 4}s ease-in-out ${(-r() * 6).toFixed(1)}s infinite`; }
    }
    // Cassiopeia, upper left
    const kC = Math.max(130, Math.min(W * .42, 270)) / 13.15;
    place(CAS, kC, -12, W * .12, Math.max(46, H * .07 + 10), false, false);
  }
  draw(); addEventListener("resize", draw);
})();
</script>
